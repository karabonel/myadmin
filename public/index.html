          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || 'Something went wrong');
          return data;

                  </button>

              <div className="empty">No stores match these filters. Try All or clear search.</div>
            )}

(()=>{logout();notify('Account deactivated.');}).catch(e=>notify(e.message,'error'))}}>Delete my account</button></div></div>;

        if(tab==='help') panel=<div className="panel"><h2 className="panel-title">Help center</h2><div className="settings-list"><label><span>Where is my order?</span><button className="text-link" onClick={()=>chooseTab('orders')}>View orders</button></label><label><span>Need help with a payment or delivery?</span><button className="text-link" onClick={()=>chooseTab('messages')}>Contact support</button></label><label><span>Report a problem</span><button className="text-link" onClick={()=>chooseTab('messages')}>Start a message</button></label></div></div>;
        if(tab==='contact') panel=<div className="panel"><h2 className="panel-title">Contact us</h2><p className="muted">Need help with an order, delivery, payment, refund, or store? Our support team is here.</p><div className="contact-card"><strong>BCM FoodHub Support</strong><p className="tiny muted">Use the form below and include your order number if you have one. We will respond through your account messages.</p></div><div className="form-grid"><Field label="Subject"><input value={supportForm.subject} onChange={e=>setSupportForm({...supportForm,subject:e.target.value})} placeholder="Order, payment, delivery..."/></Field><Field label="Order number (optional)"><input placeholder="BCM-..."/></Field><Field className="full" label="How can we help?"><textarea value={supportForm.message} onChange={e=>setSupportForm({...supportForm,message:e.target.value})} placeholder="Tell us what happened and how we can help."/></Field></div><button className="btn btn-primary" onClick={sendSupport}>Send message to support</button></div>;
        if(tab==='assistant') panel=<div className="panel"><h2 className="panel-title">BCM FoodHub Assistant</h2><p className="muted">Ask about products, makers, delivery, PayFast payments, orders, rewards, policies, and support.</p><div className="assistant-chat" style={{marginTop:15}}>{assistantMessages.map((message,index)=><div className={`assistant-message ${message.role==='user'?'user':''}`} key={index}>{message.text}{message.suggestions?.length>0&&<div className="assistant-suggestions" style={{marginTop:9}}>{message.suggestions.map(suggestion=><button key={suggestion} onClick={()=>askAssistant(suggestion)}>{suggestion}</button>)}</div>}</div>)}{assistantBusy&&<div className="assistant-message">Thinking about something delicious...</div>}</div><div className="form-grid" style={{marginTop:14}}><Field className="full" label="Ask BCM Assistant"><input value={assistantInput} onChange={e=>setAssistantInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&askAssistant()} placeholder="How does delivery work?"/></Field></div><button className="btn btn-primary" onClick={()=>askAssistant()}>Ask assistant</button></div>;
        if(tab==='quotes') panel=<div className="panel"><div className="account-tab-title"><div><h2 className="panel-title">Cake quotes</h2><p className="muted">Custom cake requests — pay only after you accept a price.</p></div><button className="btn btn-outline small" onClick={()=>go('cake-builder')}>New cake quote</button></div>{quotes.length?quotes.map(q=><div className="order-card" key={q._id}><div className="split"><div><h4>{q.quoteNumber}</h4><div className="tiny muted">{q.storeName} · {q.design?.occasion} · serves {q.design?.serves}</div>{q.quotedPrice!=null&&<div className="tiny">Quoted: <strong>{money(q.quotedPrice)}</strong>{q.quoteNotes?` — ${q.quoteNotes}`:''}</div>}</div><Status>{q.status}</Status></div>{q.status==='quoted'&&<div className="hero-buttons" style={{marginTop:10}}><button className="btn btn-primary small" onClick={()=>api(`/api/quotes/${q._id}/respond`,{method:'PUT',body:JSON.stringify({action:'accept'})}).then(()=>{notify('Quote accepted — the maker will confirm next steps.');api('/api/quotes').then(setQuotes);}).catch(e=>notify(e.message,'error'))}>Accept quote</button><button className="btn btn-outline small" onClick={()=>api(`/api/quotes/${q._id}/respond`,{method:'PUT',body:JSON.stringify({action:'decline'})}).then(()=>{notify('Quote declined');api('/api/quotes').then(setQuotes);})}>Decline</button></div>}</div>):<div className="empty">No cake quotes yet. <button className="text-link" onClick={()=>go('cake-builder')}>Build a custom cake</button></div>}</div>;
        if(tab==='refunds') panel=<div className="panel"><h2 className="panel-title">Refund requests</h2><p className="muted">Track refund and dispute requests for your orders.</p>{refunds.length?refunds.map(r=><div className="order-card" key={r._id}><div className="split"><div><h4>{r.orderNumber}</h4><div className="tiny muted">{r.reason} · {new Date(r.createdAt).toLocaleDateString('en-ZA')}</div><p className="tiny">{r.details}</p></div><Status>{r.status}</Status></div></div>):<div className="empty">No refund requests yet. You can request one from an order.</div>}</div>;
        if(tab==='stock-alerts') panel=<div className="panel"><h2 className="panel-title">Back-in-stock alerts</h2><p className="muted">We will notify you when these products are available again.</p>{stockAlerts.length?stockAlerts.map(a=><div className="cart-line" key={a._id}><div className="cart-thumb" style={{backgroundImage:a.product?`url(${safeImage(a.product.images?.[0])})`:'none'}}></div><div style={{flex:1}}><strong>{a.product?.name||a.productId}</strong><div className="tiny muted">Watching stock</div></div><button className="btn btn-outline small" onClick={()=>api('/api/stock-alerts/'+a.productId,{method:'DELETE'}).then(()=>{notify('Alert removed');api('/api/stock-alerts').then(setStockAlerts);})}>Remove</button></div>):<div className="empty">No stock alerts. Tap “Notify me when back” on an out-of-stock product.</div>}</div>;
        if(tab==='legal') panel=<div className="panel"><h2 className="panel-title">Legal policies</h2><div className="legal-section"><h3>Terms & Conditions</h3><p>BCM FoodHub is a marketplace connecting customers with independent food makers. Product availability, preparation times, ingredients, and delivery schedules are supplied by each maker. By ordering, you agree to provide accurate delivery details and to use PayFast for secure payment.</p></div><div className="legal-section"><h3>Privacy Policy</h3><p>We use your account, delivery, order, and support information to process purchases, provide delivery updates, improve marketplace discovery, and protect the platform. We do not sell personal information. Payment card details are handled by PayFast and are not stored by BCM FoodHub.</p></div><div className="legal-section"><h3>Refund Policy</h3><p>If an order is missing, damaged, incorrect, or materially different from the listing, contact us as soon as possible with your order number and supporting details. Refunds are assessed case by case with the relevant maker and payment provider. Paid orders already in preparation may not be cancelled automatically.</p></div></div>;
        return <main className="container page"><div className="account-shell"><nav className={`account-menu-bar ${mobileAccountMenu?'menu-open':''}`} aria-label="Account navigation"><div className="account-menu-backdrop" onClick={()=>setMobileAccountMenu(false)} aria-hidden="true"></div><button type="button" className="account-mobile-toggle" onClick={()=>setMobileAccountMenu(!mobileAccountMenu)} aria-expanded={mobileAccountMenu} aria-controls="account-hamburger-popover"><span className="account-toggle-user"><span className="account-toggle-avatar">{user.avatar?<img src={safeImage(user.avatar)} alt=""/>:initials}</span><span><small>MY FOODHUB</small><strong>{activeTabLabel}</strong></span></span><span className="account-toggle-action"><span>Menu</span><span className="account-hamburger" aria-hidden="true"><i></i><i></i><i></i></span></span></button><div id="account-hamburger-popover" className={`account-menu-links ${mobileAccountMenu?'open':''}`} role="menu"><div className="account-menu-popover-head"><div><span>YOUR ACCOUNT</span><strong>{user.name||'Member'}</strong><small>{user.email||''}</small></div><button type="button" className="account-menu-close" onClick={()=>setMobileAccountMenu(false)} aria-label="Close account menu">×</button></div><div className="account-menu-grid">{tabs.map(([id,icon,label])=><button type="button" className={tab===id?'active':''} key={id} role="menuitem" onClick={()=>chooseTab(id)}><span className="account-menu-item-icon" aria-hidden="true">{icon}</span><span>{label}</span>{tab===id&&<b>✓</b>}</button>)}{user.role==='super_admin'&&<button type="button" role="menuitem" onClick={()=>{setMobileAccountMenu(false);go('admin')}}><span className="account-menu-item-icon" aria-hidden="true">⚑</span><span>Admin approvals</span></button>}<button type="button" onClick={logout} className="logout" role="menuitem"><span className="account-menu-item-icon" aria-hidden="true">↪</span><span>Log out</span></button></div></div></nav><div>{panel}</div></div></main>;
      };

      const Auth = () => {
        const bootResetToken=(()=>{try{const p=new URLSearchParams(window.location.search);const t=p.get('resetToken')||sessionStorage.getItem('bcm_reset_token')||'';return t||'';}catch(e){return '';}})();
        const savedAuth=loadJSON('bcm_auth_signup_progress',{step:'email',form:{},verificationEmail:'',otpExpiresAt:0,resendAvailableAt:0,otpSent:false,otpChannel:'email'});
        const [step,setStepState] = useState(savedAuth.step==='verify'?'register':(savedAuth.step==='forgot-phone'?'forgot':(savedAuth.step||'email')));
        const [form,setForm] = useState({email:'',password:'',confirmPassword:'',name:'',phone:'',street:'',city:'',province:'',zipCode:'',instructions:'',...(savedAuth.form||{})});
        const [otp,setOtp] = useState('');
        const [resetToken,setResetToken]=useState(bootResetToken);
        const [otpChannel,setOtpChannel]=useState(savedAuth.otpChannel||'email');
        const [otpPhone,setOtpPhone]=useState('');
        const [verificationEmail,setVerificationEmail]=useState(savedAuth.verificationEmail||'');
        const [otpExpiresAt,setOtpExpiresAt]=useState(Number(savedAuth.otpExpiresAt)||0);
        const [resendAvailableAt,setResendAvailableAt]=useState(Number(savedAuth.resendAvailableAt)||0);
        const [otpSent,setOtpSent]=useState(!!savedAuth.otpSent);
        const [clock,setClock]=useState(Date.now());
        const [error,setError] = useState('');
        const [busy,setBusy] = useState(false);
        const saveAuthProgress = (nextStep, extra = {}) => {
          try {
            const current = loadJSON('bcm_auth_signup_progress', {});
            const nextObj = { ...current, step: nextStep, ...extra };
            localStorage.setItem('bcm_auth_signup_progress', JSON.stringify(nextObj));
          } catch(e) {}
        };
        const setStep = (next, extra = {}) => {
          saveAuthProgress(next, extra);
          setStepState(next);
        };
        useEffect(()=>{
          try{
            const params=new URLSearchParams(window.location.search);
            const t=params.get('resetToken');
            if(t){
              setResetToken(t);
              sessionStorage.setItem('bcm_reset_token', t);
              setStep('reset');
              setError('');
            }
          }catch(e){}
        },[]);

        useEffect(()=>{localStorage.setItem('bcm_auth_signup_progress',JSON.stringify({step,form,verificationEmail,otpExpiresAt,resendAvailableAt,otpSent,otpChannel}));},[step,form,verificationEmail,otpExpiresAt,resendAvailableAt,otpSent,otpChannel]);
        useEffect(()=>{if(!(otpSent||step==='reset'))return;const tick=()=>setClock(Date.now());tick();const interval=window.setInterval(tick,1000);return()=>window.clearInterval(interval);},[otpSent,step]);
        const secondsUntil=time=>Math.max(0,Math.ceil((Number(time||0)-clock)/1000));
        const formatTimer=seconds=>`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
        const otpSecondsLeft=secondsUntil(otpExpiresAt);
        const resendSecondsLeft=secondsUntil(resendAvailableAt);
        const otpExpired=(otpSent||step==='reset')&&otpSecondsLeft===0;
        const otpReady=otpSent&&otp.length===4&&!otpExpired;
        const markOtpSent=result=>{
          const data=result||{};
          const lifetime=Math.max(1,Number(data.expiresIn)||120);
          const cooldown=Math.max(0,Number(data.resendCooldown)||30);
          const now=Date.now();
          setVerificationEmail(data.email||form.email);
          setOtpPhone(data.phone||form.phone||'');
          setOtpChannel(data.channel==='whatsapp'?'whatsapp':(otpChannel||'email'));
          setOtp('');
          setError('');
          setOtpExpiresAt(now+lifetime*1000);
          setResendAvailableAt(now+cooldown*1000);
          setClock(now);
          setOtpSent(true);
          if(data.channel==='whatsapp') notify(data.message||'We sent a 4-digit code to your WhatsApp.');
          else notify(data.message||'We sent a 4-digit verification code to your email.');
          window.setTimeout(()=>{ const el=document.getElementById('otp-digit-0'); if(el) el.focus(); }, 50);
        };
        const resetAuth=()=>{localStorage.removeItem('bcm_auth_signup_progress');setStep('email');setOtp('');setVerificationEmail('');setOtpPhone('');setOtpChannel('email');setOtpExpiresAt(0);setResendAvailableAt(0);setOtpSent(false);setError('');setForm({email:'',password:'',name:'',phone:'',street:'',city:'',province:'',zipCode:'',instructions:''});};
        const validateRegisterFields=()=>{
          const missing=[];
          if(!form.name) missing.push('full name');
          if(!form.phone) missing.push('phone number');
          if(!form.street) missing.push('street address');
          if(!form.city) missing.push('city / town');
          if(!form.province) missing.push('province');
          if(!form.zipCode) missing.push('postal code');
          if(missing.length) throw new Error('Please fill in: '+missing.join(', ')+'.');
          if((form.password||'').length<8) throw new Error('Password must be at least 8 characters.');
          if(!/^\S+@\S+\.\S+$/.test(String(form.email||'').trim())) throw new Error('Enter a valid email address.');
          
        };
        const check = async () => { try {setBusy(true);setError('');if(!/^\S+@\S+\.\S+$/.test(form.email.trim()))throw new Error('Enter a valid email address.');const r=await api('/api/auth/check-email',{method:'POST',body:JSON.stringify({email:form.email})});setOtpSent(false);setOtp('');setStep(r.exists?'login':'register');}catch(e){setError(e.message);}finally{setBusy(false);}};
        const finishVerifiedAccount=async result=>{localStorage.setItem('bcm_token',result.token);setUser(result.user);try{await api('/api/addresses',{method:'POST',body:JSON.stringify({label:'Home',recipientName:form.name,phone:form.phone,street:form.street,city:form.city,province:form.province,zipCode:form.zipCode,instructions:form.instructions,isDefault:true})});}catch(addressError){notify('Account verified. You can add your address at checkout.','error');}localStorage.removeItem('bcm_auth_signup_progress');notify('Email verified — your account is ready!');go(afterAuth,{replace:true});};
        const sendRegisterOtp=async(channelOverride)=>{
          try{
            setBusy(true);setError('');
            if(channelOverride) setOtpChannel(channelOverride);
            const channel=channelOverride||otpChannel||'email';
            validateRegisterFields();
            const result=await api('/api/auth/register',{method:'POST',body:JSON.stringify({...form,channel}),timeoutMs:25000});
            markOtpSent({...result,channel:result.channel||channel});
          }catch(e){setError(e.message);}finally{setBusy(false);}
        };
        const submit = async () => {
          try {
            setBusy(true);
            setError('');
            if(step==='login') {
              const result=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:form.email,password:form.password}),timeoutMs:20000});
              localStorage.setItem('bcm_token',result.token);
              setUser(result.user);
              localStorage.removeItem('bcm_auth_signup_progress');
              notify('Welcome back!');
              go(afterAuth,{replace:true});
              return;
            }
            if(step==='register') {
              validateRegisterFields();
              const result=await api('/api/auth/register',{method:'POST',body:JSON.stringify({
                name:form.name,email:form.email,password:form.password,phone:form.phone
              }),timeoutMs:25000});

      const CakeBuilder = () => {

            <div className="cake-plate" />
            {design.messageOnCake ? <div className="cake-message-tag">“{design.messageOnCake}”</div> : null}
            <div className="tiny muted" style={{ marginTop: 10, textAlign: 'center', position: 'relative', zIndex: 2 }}>
              {(design.flavours || []).join(' · ')} · {design.frosting}
              {(design.dietary || []).length ? ` · ${design.dietary.join(', ')}` : ''}
            </div>
          </div>
        );

        if (sent) {
          return (
            <main className="container page cake-builder">
              <div className="panel" style={{ textAlign: 'center', padding: 28 }}>
                <div className="payment-icon success" style={{ margin: '0 auto 14px' }}>✓</div>
                <h1 className="panel-title">Quote requested</h1>
                <p className="muted">Reference <strong>{sent.quoteNumber}</strong> was sent to <strong>{sent.storeName}</strong>. You will be notified when they quote a price — no payment yet.</p>
                <div className="hero-buttons" style={{ justifyContent: 'center', marginTop: 16 }}>
                  <button className="btn btn-primary" onClick={() => { setAccountSection('quotes'); go('account'); }}>View my quotes</button>
                  <button className="btn btn-outline" onClick={() => go('home')}>Home</button>
                </div>
              </div>
            </main>
          );
        }

        const progress = ((step + 1) / steps.length) * 100;

        return (
          <main className="container page cake-builder">
            <div className="section-head">
              <div>
                <div className="eyebrow" style={{ color: 'var(--purple)' }}>Custom cake builder</div>
                <h1 className="title" style={{ fontSize: 36, margin: '4px 0' }}>Design it live. Get a quote.</h1>
                <p>Watch your cake update as you choose. Then pick a nearby maker — they send a price; you pay only if you accept.</p>
              </div>
            </div>
            <div className="cake-steps">
              {steps.map((s, i) => (
                <button
                  key={s.id}
                  type="button"
                  className={`cake-step-pill ${i === step ? 'active' : ''} ${i < step ? 'done' : ''}`}
                  onClick={() => { if (i <= step) goStep(i); }}
                >
                  {i + 1}. {s.title}
                </button>
              ))}
            </div>
            <div className="cake-builder-layout">
              <CakeVisual />
              <div className={`cake-form-panel ${shake ? 'cart-bump' : ''}`}>
                <div className="cake-progress"><i style={{ width: `${progress}%` }} /></div>
                <div className="step-enter" key={step}>
                  <h2 className="cake-step-title">{steps[step].title}</h2>
                  <p className="cake-step-desc">{steps[step].desc}</p>

                  {step === 0 && (
                    <>
                      <div className="option-grid">
                        {['Birthday', 'Wedding', 'Anniversary', 'Baby shower', 'Corporate', 'Just because'].map(o => (
                          <button key={o} type="button" className={`option-chip ${design.occasion === o ? 'active' : ''}`} onClick={() => set('occasion', o)}>{o}</button>
                        ))}
                      </div>
                      <div className="form-grid" style={{ marginTop: 14 }}>
                        <Field className="full" label="Message on cake (optional)">
                          <input value={design.messageOnCake} onChange={e => set('messageOnCake', e.target.value)} placeholder="Happy Birthday Thandi" maxLength={40} />
                        </Field>
                      </div>
                    </>
                  )}

                  {step === 1 && (
                    <>
                      <div className="form-grid">
                        <Field label="Serves">
                          <input type="number" min="4" max="200" value={design.serves} onChange={e => set('serves', Number(e.target.value) || 4)} />
                        </Field>
                        <Field label="Tiers">
                          <select value={design.tiers} onChange={e => set('tiers', Number(e.target.value))}>
                            <option value={1}>1 tier</option>
                            <option value={2}>2 tiers</option>
                            <option value={3}>3 tiers</option>
                          </select>
                        </Field>
                      </div>
                      <p className="tiny muted" style={{ marginTop: 12 }}>Shape</p>
                      <div className="option-grid">
                        {['Round', 'Square', 'Heart', 'Sheet', 'Number'].map(o => (
                          <button key={o} type="button" className={`option-chip ${design.shape === o ? 'active' : ''}`} onClick={() => set('shape', o)}>{o}</button>
                        ))}
                      </div>
                    </>
                  )}

                  {step === 2 && (
                    <>
                      <div className="option-grid">
                        {['Vanilla', 'Chocolate', 'Red velvet', 'Lemon', 'Carrot', 'Funfetti', 'Coffee', 'Coconut'].map(o => (
                          <button key={o} type="button" className={`option-chip ${design.flavours.includes(o) ? 'active' : ''}`} onClick={() => toggleFlavour(o)}>{o}</button>
                        ))}
                      </div>
                      <div className="form-grid" style={{ marginTop: 14 }}>
                        <Field className="full" label="Filling">
                          <input value={design.filling} onChange={e => set('filling', e.target.value)} placeholder="e.g. Berry compote, salted caramel" />
                        </Field>
                      </div>
                    </>
                  )}

                  {step === 3 && (
                    <>
                      <p className="tiny muted">Frosting</p>
                      <div className="option-grid">
                        {['Buttercream', 'Fondant', 'Whipped cream', 'Ganache'].map(o => (
                          <button key={o} type="button" className={`option-chip ${design.frosting === o ? 'active' : ''}`} onClick={() => set('frosting', o)}>{o}</button>
                        ))}
                      </div>
                      <p className="tiny muted" style={{ marginTop: 14 }}>Colour theme</p>
                      <div className="option-grid">
                        {Object.keys(themeTint).map(o => (
                          <button key={o} type="button" className={`option-chip ${design.colourTheme === o ? 'active' : ''}`} onClick={() => set('colourTheme', o)} style={design.colourTheme === o ? { boxShadow: `0 0 0 2px ${themeTint[o]}` } : {}}>
                            <span style={{ display: 'inline-block', width: 12, height: 12, borderRadius: 4, background: themeTint[o], marginRight: 6, verticalAlign: 'middle' }} />
                            {o}
                          </button>
                        ))}
                      </div>
                      <p className="tiny muted" style={{ marginTop: 14 }}>Dietary</p>
                      <div className="option-grid">
                        {['Halaal', 'Vegetarian', 'Eggless', 'Gluten-free', 'Nut-free'].map(o => (
                          <button key={o} type="button" className={`option-chip ${design.dietary.includes(o) ? 'active' : ''}`} onClick={() => toggleDiet(o)}>{o}</button>
                        ))}
                      </div>
                    </>
                  )}

                  {step === 4 && (
                    <div className="form-grid">
                      <Field label="Needed by"><input type="date" value={design.neededBy} onChange={e => set('neededBy', e.target.value)} /></Field>
                      <Field label="Budget min (R)"><input type="number" min="0" value={design.budgetMin} onChange={e => set('budgetMin', e.target.value)} /></Field>
                      <Field label="Budget max (R)"><input type="number" min="0" value={design.budgetMax} onChange={e => set('budgetMax', e.target.value)} /></Field>
                      <Field className="full" label="Inspiration image URLs (optional)"><textarea value={design.inspirationUrls} onChange={e => set('inspirationUrls', e.target.value)} placeholder="One URL per line" /></Field>
                      <Field className="full" label="Notes for the baker"><textarea value={design.notes} onChange={e => set('notes', e.target.value)} placeholder="Allergies, delivery hints, design details…" /></Field>
                    </div>
                  )}

                  {step === 5 && (
                    <>
                      {!user && (
                        <div className="form-grid" style={{ marginBottom: 14 }}>
                          <Field label="Your name *"><input value={guest.name} onChange={e => setGuest({ ...guest, name: e.target.value })} /></Field>
                          <Field label="Email *"><input type="email" value={guest.email} onChange={e => setGuest({ ...guest, email: e.target.value })} /></Field>
                          <Field label="Phone *"><input value={guest.phone} onChange={e => setGuest({ ...guest, phone: e.target.value })} /></Field>
                        </div>
                      )}
                      <div className="split" style={{ marginBottom: 12, alignItems: 'center' }}>
                        <p className="muted" style={{ margin: 0 }}>Makers across South Africa that sell cakes / bakery items.</p>
                        <label className="check-row" style={{ whiteSpace: 'nowrap' }}>
                          <input type="checkbox" checked={nearMe} onChange={e => setNearMe(e.target.checked)} /> Near me first
                        </label>
                      </div>
                      {makers.length ? makers.map(store => (
                        <button type="button" key={store.id} className={`quote-store-card ${selectedStoreId === store.id ? 'selected' : ''}`} onClick={() => setSelectedStoreId(store.id)}>
                          <div className="split"><strong>{store.name}</strong><span className="tag">★ {store.rating}</span></div>
                          <div className="tiny muted">{store.city}, {store.province} · {store.preparationDays || 2}d prep · {(store.shippingRegions || ['Nationwide']).slice(0, 3).join(', ')}</div>
                          {store.customCakeNotes && <p className="tiny" style={{ marginTop: 6 }}>{store.customCakeNotes}</p>}
                        </button>
                      )) : makersLoading ? <div className="empty">Finding cake makers near you…</div> : <div className="empty"><strong>No cake makers found right now</strong><p style={{margin:'8px 0'}}>Your design is saved on this step. Try again, or go back one step to adjust details — you will not lose your cake.</p><div className="hero-buttons" style={{justifyContent:'center'}}><button type="button" className="btn btn-outline" onClick={loadMakers}>Retry</button><button type="button" className="btn btn-outline" onClick={() => goStep(4)}>Back to budget & date</button></div></div>}
                    </>
                  )}
                </div>
                <div className="cake-nav">
                  <button type="button" className="btn btn-outline" onClick={back} disabled={step === 0}>Back</button>
                  <button type="button" className="btn btn-primary" onClick={next} disabled={busy}>
                    {busy ? 'Sending…' : step === steps.length - 1 ? 'Request quote from maker' : 'Continue'}
                  </button>
                </div>
              </div>
            </div>
          </main>
        );
      };

      const PaymentReturn = ({type}) => {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order');
        const [info,setInfo]=useState(null);
        useEffect(()=>{
          if(!orderId||!user) return;
          const poll=()=>api('/api/payments/order/'+orderId).then(setInfo).catch(()=>{});
          poll();
          const t=setInterval(poll, 4000);
          return ()=>clearInterval(t);
        },[orderId,user]);
        const title = type==='success' ? 'Payment received' : type==='cancel' ? 'Payment cancelled' : 'Payment pending';
        const copy = type==='success' ? 'Thank you! Your makers have been notified and will start preparing your order.' : type==='cancel' ? 'No charge was made. You can return to your bag and try again whenever you are ready.' : 'PayFast is still confirming your payment. This page refreshes automatically.';
        return <main className="container page payment-page"><div className="panel payment-card confetti-msg"><div className={`payment-icon ${type==='success'?'success':type==='cancel'?'cancel':'pending'}`}>{type==='success'?'✓':type==='cancel'?'✕':'…'}</div><h1>{title}</h1><p>{copy}</p>{info?.order&&<div className="summary" style={{marginTop:16,textAlign:'left'}}><div className="row"><span>Order</span><strong>{info.order.orderNumber}</strong></div><div className="row"><span>Status</span><Status>{info.order.status}</Status></div><div className="row total"><span>Total</span><span>{money(info.order.total)}</span></div></div>}<div className="hero-buttons" style={{marginTop:18,justifyContent:'center'}}><button className="btn btn-primary" onClick={()=>{ if(info?.order){ setSelectedOrder(info.order); go('order-detail'); } else { setAccountSection('orders'); go('account'); } }}>View order</button><button className="btn btn-outline" onClick={()=>go('home')}>Back home</button></div></div></main>;
      };

      const OrderDetail = () => {
        const [order,setOrder]=useState(null); const [busy,setBusy]=useState(true); const [tick,setTick]=useState(0);
        const id = selectedOrder?._id || selectedOrder;
        useEffect(()=>{ if(!id||!user) return; setBusy(true); api('/api/orders/'+id).then(data=>{setOrder(data.order||data); setBusy(false);}).catch(e=>{notify(e.message,'error'); setBusy(false);}); },[id,user,tick]);
        useEffect(()=>{ if(!id||!user) return; const t=setInterval(()=>setTick(x=>x+1),18000); return ()=>clearInterval(t); },[id,user]);
        if(busy||!order) return <main className="container page"><div className="premium-skeleton"></div></main>;
        const steps=['Pending Payment','Paid','Confirmed','Preparing','Packed','Shipped','In Transit','Delivered','Completed'];
        const idx=Math.max(0, steps.indexOf(order.status));
        const requestRefund=()=>{const reason=window.prompt('Reason (missing / damaged / incorrect / quality / late / other)','other'); if(!reason)return; const details=window.prompt('Describe the issue')||''; api(`/api/orders/${order._id}/refund-request`,{method:'POST',body:JSON.stringify({reason,details})}).then(()=>notify('Refund request submitted.')).catch(e=>notify(e.message,'error'));};
        return <main className="container page" style={{maxWidth:820}}><button className="text-link" onClick={()=>{setAccountSection('orders');go('account')}}>← Back to orders</button>
        <div className="panel" style={{marginTop:14}}><div className="split"><div><div className="eyebrow" style={{color:'var(--purple)'}}>Order tracking</div><h1 className="panel-title" style={{fontSize:28}}>{order.orderNumber}</h1><p className="tiny muted">{new Date(order.createdAt).toLocaleString('en-ZA')} · Auto-refreshes</p></div><Status>{order.status}</Status></div>
        <div className="order-detail-timeline" style={{marginTop:18}}>{steps.filter(s=>!['Cancelled','Refunded'].includes(s)).map((step,i)=><div className={`order-step ${i<idx?'done':''} ${i===idx?'active':''}`} key={step}><div className="dot"></div><div><strong style={{fontSize:13}}>{step}</strong>{i===idx&&order.trackingNumber&&<div className="tiny muted">{order.courier||'Courier'} · {order.trackingNumber}</div>}</div></div>)}</div>
        <div className="summary" style={{marginTop:8}}>{order.items?.map(item=><div className="row" key={item.productId+item.storeName}><span>{item.quantity}× {item.productName}<div className="tiny muted">{item.storeName} · {item.fulfillmentStatus||order.status}</div></span><span>{money(item.price*item.quantity)}</span></div>)}<div className="row"><span>Delivery</span><span>{money(order.shippingFee||0)}</span></div>{!!order.discountAmount&&<div className="row"><span>Discount</span><span>-{money(order.discountAmount)}</span></div>}<div className="row total"><span>Total</span><span>{money(order.total)}</span></div></div>
        <div className="hero-buttons" style={{marginTop:16}}><button className="btn btn-outline" onClick={()=>setTick(x=>x+1)}>Refresh status</button>{['Paid','Confirmed','Preparing','Packed','Shipped','In Transit','Delivered','Completed'].includes(order.status)&&<button className="btn btn-outline" onClick={requestRefund}>Request refund</button>}{order.status==='Pending Payment'&&<button className="btn btn-danger" onClick={()=>{if(window.confirm('Cancel this unpaid order?'))api(`/api/orders/${order._id}/cancel`,{method:'PUT'}).then(()=>{notify('Order cancelled');setTick(x=>x+1);}).catch(e=>notify(e.message,'error'));}}>Cancel order</button>}</div></div></main>;
      };

      const WishlistSharePage = () => {
        const [data,setData]=useState(null); const [err,setErr]=useState('');
        useEffect(()=>{ const token=(selectedCollection && selectedCollection.shareToken) || (typeof location!=='undefined' && location.pathname.startsWith('/wishlist/') ? location.pathname.split('/').pop() : ''); if(!token){setErr('Missing share link');return;} api('/api/wishlist/share/'+token).then(setData).catch(e=>setErr(e.message)); },[]);
        if(err) return <main className="container page"><div className="empty">{err}</div></main>;
        if(!data) return <main className="container page"><div className="premium-skeleton"></div></main>;
        return <main className="container page"><div className="section-head"><div><div className="eyebrow" style={{color:'var(--purple)'}}>Shared wishlist</div><h1 className="title" style={{fontSize:34,margin:'4px 0'}}>{data.title}</h1><p className="muted">Curated by {data.ownerName}</p></div></div>{data.products?.length?<div className="product-grid">{data.products.map(product=><ProductCard onOpen={showProduct} onAdd={addToCart} product={product} key={product.id}/>)}</div>:<div className="empty">This wishlist is empty.</div>}</main>;
      };
      let content = view==='home'?<Home/>:view==='search'?<Search/>:view==='categories'?<Categories/>:view==='stores'?<Stores/>:view==='store'?<StorePage/>:view==='product'?<ProductPage/>:view==='cart'?<Cart/>:view==='checkout'?<Checkout/>:view==='account'?<Account/>:view==='auth'?<Auth/>:view==='admin'?<Admin/>:view==='collection'?<Collection/>:view==='payment-success'?<PaymentReturn type="success"/>:view==='payment-cancel'?<PaymentReturn type="cancel"/>:view==='payment-pending'?<PaymentReturn type="pending"/>:view==='wishlist-share'?<WishlistSharePage/>:view==='order-detail'?<OrderDetail/>:view==='cake-builder'?<CakeBuilder/>:<CakeFinder/>;
      return <div className="shell">{isOffline&&<div className="offline-banner" role="status">You are offline — your cart is saved on this device.</div>}<div className="topline">BCM FoodHub · Shop independent food makers with delivery across South Africa</div><header className="header"><div className="brand-with-search"><button className="brand" onClick={()=>go('home')} aria-label="BCM FoodHub home"><Logo full/></button><button type="button" className="header-search-btn" aria-label="Search" onClick={()=>go('search')}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></div><button className="delivery-chip" onClick={()=>isNative?requestLocationPermission():go('stores')} aria-label="Set delivery location or browse stores"><span>⌖</span><span><small>DELIVERING TO</small><strong>South Africa · Nationwide</strong></span><span>⌄</span></button><div className="header-actions"><button className="head-link" onClick={()=>go('stores')}>Stores</button><button className="head-link" onClick={()=>go('cake-builder')}>Custom cake</button><button className={`circle-btn ${cartBump ? 'cart-bump' : ''}`} data-bag-target="true" aria-label="Cart" onClick={()=>go('cart')}><BagIcon swallow={cartBump}/>{cartCount>0&&<span className="count">{cartCount}</span>}</button><button className="circle-btn" aria-label="Account" onClick={()=>{setAccountSection('dashboard');go(user?'account':'auth')}}>◉</button></div></header>{content}<nav className="mobile-nav" aria-label="Main navigation"><button className={view==='home'?'active':''} onClick={()=>go('home')}><span className="nav-symbol">⌂</span><span>Home</span></button><button className={view==='categories'?'active':''} onClick={()=>go('categories')}><span className="nav-symbol">▤</span><span>Categories</span></button><button className={`nav-bag ${view==='cart'?'active':''}`} onClick={()=>go('cart')}><span className="nav-symbol"><BagIcon swallow={cartBump}/></span><span>Bag{cartCount?` ${cartCount}`:''}</span></button><button className={view==='stores'||view==='store'?'active':''} onClick={()=>go('stores')}><span className="nav-symbol">🏪</span><span>Stores</span></button><button className={view==='account'||view==='auth'?'active':''} onClick={()=>{setAccountSection('dashboard');go(user?'account':'auth')}}><span className="nav-symbol">◉</span><span>Profile</span></button></nav>{flyingProduct&&flyingProduct.src?<img key={flyingProduct.key} className="flying-product" src={flyingProduct.src} alt="" style={{left:Math.max(12,(flyingProduct.x||0)-28),top:Math.max(12,(flyingProduct.y||0)-28),'--dx':((flyingProduct.dx||0))+'px','--dy':((flyingProduct.dy||0))+'px'}} onError={e=>{e.currentTarget.style.display='none'}}/>:null}{toast&&<div className={`toast ${toast.type}`}>{toast.message}</div>}{booting&&<Loader/>}</div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
