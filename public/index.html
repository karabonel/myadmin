  <style>

 solid #2c6941}.btn.danger{background:#54262c;color:#ffc2c8;border:1px solid #7a3842}.btn.gold{background:#5b461d;color:#ffe6a3;border:1px solid #806728}.btn.small{padding:7px 9px;font-size:11px}.btn.full{width:100%}.error{padding:11px 12px;border-radius:10px;background:#4c2028;color:#ffc5cb;font-size:13px;font-weight:700;margin:12px 0}.hint{margin-top:16px;padding:12px;border-radius:10px;background:#112719;color:#aeecc0;font-size:12px;line-height:1.5}.shell{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:19px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:20}.sidebar .brand{padding:0 8px 20px;border-bottom:1px solid var(--line);margin-bottom:12px}.nav{overflow:auto}.nav button{display:flex;align-items:center;gap:10px;border:0;width:100%;padding:10px 11px;border-radius:9px;background:transparent;color:var(--muted);text-align:left;font-weight:700;font-size:13px;margin:2px 0}.nav button:hover,.nav button.active{background:#1c3424;color:#fff}.nav .nav-icon{width:18px;text-align:center;color:var(--green);font-size:15px}.nav .admin-link{margin-top:11px;border-top:1px solid var(--line);padding-top:15px}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 4px}.admin-mini{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px}.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#215c37;color:#e9fff0;font-weight:900}.main{min-width:0}.topbar{height:69px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 29px;background:rgba(14,23,17,.88);backdrop-filter:blur(11px);position:sticky;top:0;z-index:15}.topbar h1{margin:0;font-size:20px;letter-spacing:-.65px}.topbar p{font-size:11px;color:var(--muted);margin:2px 0 0}.top-actions{display:flex;gap:9px;align-items:center}.content{width:min(1440px,calc(100% - 48p     .mobile-primary-nav,.mobile-more-backdrop{display:none}.admin-recent-cards{display:none}.admin-order-card{border:1px solid #304f3a;border-radius:12px;padding:12px;background:#13241a;margin-top:9px}.admin-order-head,.admin-order-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.admin-card-meta{font-size:12px;color:var(--muted);line-height:1.5;margin:9px 0}.admin-store-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;background:#14231a}.admin-store-card strong{font-size:14px}.dashboard-stats{grid-template-columns:repeat(4,1fr)}.leaderboard-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.leaderboard-row:last-child{border-bottom:0}.verification-box{padding:11px;border-radius:10px;background:#102017;border:1px solid #2c4b35;margin-top:12px}.announcement-card{padding:15px;border:1px solid #2f4e38;border-radius:13px;background:#14271a}.payout-card{padding:13px;border:1px solid var(--line);border-radius:12px;background:#14231a;margin:9px 0}.page-error{max-width:620px;margin-top:20px}.page-error h2{margin:0 0 6px;font-size:21px}.page-error p{color:var(--muted);font-size:13px;margin:0 0 14px}@media(min-width:1051px){.dashboard-stats{grid-template-columns:repeat(4,1fr)}.panel{transition:box-shadow .18s}.panel:hover{box-shadow:0 9px 25px rgba(0,0,0,.14)}}@media(max-width:650px){.sidebar{display:none}.main{padding-bottom:82px}.topbar{height:61px;padding:0 14px}.topbar h1{font-size:17px}.topbar p{display:none}.top-actions .btn.light{display:none}.top-actions .btn.primary{padding:8px 10px}.content{width:calc(100% - 24px);padding:17px 0 22px}.dashboard-stats{grid-template-columns:repeat(2,1fr)}.stat{padding:12px}.stat strong{font-size:21px}.grid{display:grid;grid-template-columns:1fr;gap:11px;margin-top:11px}.admin-recent-table{display:none}.admin-recent-cards{display:block}.table-wrap{margin:0 -3px}.drawer{top:20px;width:100%;border-radius:18p <body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const {useState,useEffect} = React;
    const money = value => `R${Number(value||0).toLocaleString('en-ZA',{minimumFractionDigits:0,maximumFractionDigits:2})}`;
    const date = value => value ? new Date(value).toLocaleDateString('en-ZA') : '—';
    const api = (path, options={}) => { const token=localStorage.getItem('bcm_super_admin_token'); const headers={'Content-Type':'application/json',...(options.headers||{})}; if(token)headers.Authorization=`Bearer ${token}`; return fetch(path,{...options,headers}).then(async response=>{const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed');return data;}); };
    const Status=({children})=><span className={`status ${String(children||'draft').toLowerCase().replaceAll(' ','-')}`}>{children}</span>;
    const Field=({label,children,full=false})=><div className={`field ${full?'full':''}`}><label>{label}</label>{children}</div>;
    const Empty=({children})=><div className="empty">{children}</div>;
    class ViewBoundary extends React.Component { constructor(props){super(props);this.state={error:false};} static getDerivedStateFromError(){return {error:true};} componentDidUpdate(previous){if(previous.resetKey!==this.props.resetKey&&this.state.error)this.setState({error:false});} render(){return this.state.error?<div className="panel page-error"><h2>This admin page needs a refresh</h2><p>The rest of the dashboard is still available. Try again or use another navigation item.</p><button className="btn primary" onClick={()=>this.setState({error:false})}>Try again</button></div>:this.props.children;} }

    function App(){
      const [user,setUser]=useState(null);const [tab,setTab]=useState('dashboard');const [mobileMenu,setMobileMenu]=useState(false);const [loading,setLoading]=useState(true);const [toast,setToast]=useState(null);
      const notify=(message,type='success')=>{setToast({message,type});window.clearTimeout(window.__adminToast);window.__adminToast=window.setTimeout(()=>setToast(null),3600);};
      useEffect(()=>{const token=localStorage.getItem('bcm_super_admin_token');if(!token){setLoading(false);return;}api('/api/auth/me').then(setUser).catch(()=>localStorage.removeItem('bcm_super_admin_token')).finally(()=>setLoading(false));},[]);
      const logout=()=>{localStorage.removeItem('bcm_super_admin_token');setUser(null);setTab('dashboard');notify('Signed out.');};
      if(loading)return <div className="loader"><div><img src="/icon.svg" alt="BCM FoodHub"/><p>Loading Super Admin…</p></div></div>;
      if(!user)return <Login onLogin={setUser} notify={notify}/>;
      const nav=[['dashboard','▦','Dashboard'],['approvals','✓','Store approvals'],['stores','⌂','All stores'],['products','◫','Products'],['orders','◷','Orders'],['customers','◉','Customers'],['payouts','R','Payouts'],['reviews','★','Reviews'],['categories','▤','Categories'],['collections','✦','Homepage'],['coupons','%','Promotions'],['notifications','●','Notifications'],['support','☏','Support'],['refunds','↩','Refunds'],['settings','⚙','Settings'],['audit','≡','Audit log']];
      const title=nav.find(item=>item[0]===tab)?.[2]||'Super Admin';
      const view={dashboard:<Dashboard notify={notify} open={setTab}/>,approvals:<Stores notify={notify} mode="approvals"/>,stores:<Stores notify={notify} mode="all"/>,products:<Products notify={notify}/>,orders:<Orders notify={notify}/>,customers:<Customers notify={notify}/>,categories:<Categories notify={notify}/>,collections:<Collections notify={notify}/>,coupons:<Coupons notify={notify}/>,payouts:<Payouts notify={notify}/>,reviews:<Reviews notify={notify}/>,notifications:<Notifications notify={notify}/>,support:<Support notify={notify}/>,refunds:<Refunds notify={notify}/>,settings:<Settings notify={notify}/>,audit:<Audit/>,profile:<Profile user={user} setUser={setUser} notify={notify}/>}[tab];
      return <div className="app shell"><aside className="sidebar"><div className="brand"><img src="/icon.svg" alt="BCM FoodHub"/><span><strong>BCM FoodHub</strong><small>SUPER ADMIN</small></span></div><nav className="nav">{nav.map(([id,icon,label])=><button key={id} className={tab===id?'active':''} onClick={()=>setTab(id)}><span className="nav-icon">{icon}</span><span>{label}</span></button>)}<button className={`admin-link ${tab==='profile'?'active':''}`} onClick={()=>setTab('profile')}><span className="nav-icon">◉</span><span>My admin profile</span></button><button onClick={logout}><span className="nav-icon">↪</span><span>Log out</span></button></nav><div className="sidebar-foot"><div className="admin-mini"><div className="avatar">{user.name?.[0]?.toUpperCase()}</div><span>{user.name}<br/>Super Admin</span></div></div></aside><main className="main"><header className="topbar"><div><h1>{title}</h1><p>BCM FoodHub marketplace control centre</p></div><div className="top-actions"><button className="btn light small" onClick={()=>setTab('profile')}>{user.username}</button><button className="btn primary small" onClick={()=>setTab('approvals')}>Review stores</button></div></header><div className="content"><ViewBoundary resetKey={tab}>{view}</ViewBoundary></div></main><nav className="mobile-primary-nav"><button className={tab==='dashboard'?'active':''} onClick={()=>{setTab('dashboard');setMobileMenu(false)}}><span className="m-icon">▦</span><span>Home</span></button><button className={tab==='stores'||tab==='approvals'?'active':''} onClick={()=>{setTab('stores');setMobileMenu(false)}}><span className="m-icon">⌂</span><span>Stores</span></button><button className="m-action" onClick={()=>{setTab('approvals');setMobileMenu(false)}}><span className="m-icon">✓</span><span>Review</span></button><button className={tab==='orders'?'active':''} onClick={()=>{setTab('orders');setMobileMenu(false)}}><span className="m-icon">◷</span><span>Orders</span></button><button className={mobileMenu?'active':''} onClick={()=>setMobileMenu(!mobileMenu)}><span className="m-icon">☰</span><span>More</span></button></nav>{mobileMenu&&<div className="mobile-more-backdrop" onClick={()=>setMobileMenu(false)}><div className="mobile-more" onClick={event=>event.stopPropagation()}>{[['products','Products'],['customers','Customers'],['payouts','Payouts'],['reviews','Reviews'],['categories','Categories'],['collections','Homepage'],['coupons','Promotions'],['notifications','Announcements'],['support','Support'],['settings','Settings'],['audit','Activity log'],['profile','My profile']].map(([id,label])=><button key={id} onClick={()=>{setTab(id);setMobileMenu(false)}}>{label}</button>)}<button onClick={logout} style={{color:'var(--red)'}}>Log out</button></div></div>}{toast&&<div className={`toast ${toast.type==='error'?'error':''}`}>{toast.message}</div>}</div>;
    }

    function Login({onLogin,notify}){const [username,setUsername]=useState('');const [password,setPassword]=useState('');const [error,setError]=useState('');const [busy,setBusy]=useState(false);const submit=async()=>{try{setBusy(true);setError('');const result=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});localStorage.setItem('bcm_super_admin_token',result.token);onLogin(result.user);notify('Welcome to BCM Super Admin.');}catch(e){setError(e.message)}finally{setBusy(false)}};return <main className="login-screen"><section className="login-card"><div className="brand"><img src="/icon.svg" alt="BCM FoodHub"/><span><strong>BCM FoodHub</strong><small>SUPER ADMIN</small></span></div><h1>Marketplace control.</h1><p>Sign in to review stores, manage catalogue data and support customer orders.</p>{error&&<div className="error">{error}</div>}<Field label="Username"><input autoFocus value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} autoComplete="username"/></Field><Field label="Password"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} autoComplete="current-password"/></Field><button className="btn primary full" disabled={busy} onClick={submit}>{busy?'Signing in…':'Log in to Super Admin'}</button><div className="hint"><strong>Initial test login</strong><br/>Username: <b>karabo</b><br/>Password: <b>karabo</b><br/><span style={{opacity:.78}}>Change these from My Admin Profile after testing.</span></div></section></main>}

<div className="row-actions"><label className="tiny"><input type="checkbox" checked={!!form.featured} onChange={e=>setForm({...form,featured:e.target.checked})}/> Featured</label><label className="tiny"><input type="checkbox" checked={form.active!==false} onChange={e=>setForm({...form,active:e.target.checked})}/> Active</label></div><button className="btn primary" style={{marginTop:15}} onClick={save}>Save category</button></Drawer>}</>}

    function Collections({notify}){const [items,setItems]=useState([]);const [selected,setSelected]=useState(null);const load=()=>api('/api/admin/collections').then(setItems).catch(e=>notify(e.message,'error'));useEffect(()=>{load();},[]);const save=()=>api(`/api/admin/collections/${selected._id}`,{method:'PUT',body:JSON.stringify(selected)}).then(()=>{notify('Collection updated.');setSelected(null);load();}).catch(e=>notify(e.message,'error'));return <><div className="page-head"><div><h2>Collections</h2><p>Control homepage curation and seasonal merchandising.</p></div><button className="btn light" onClick={load}>Refresh</button></div><section className="panel"><div className="table-wrap"><table className="table"><thead><tr><th>Collection</th><th>Type</th><th>Products</th><th>Featured</th><th>Visibility</th><th></th></tr></thead><tbody>{items.map(item=><tr key={item._id}><td><strong>{item.name}</strong><br/><span className="tiny muted">{item.description}</span></td><td>{item.type}</td><td>{item.productIds?.length||0}</td><td>{item.featured?'Yes':'No'}</td><td><Status>{item.active?'Active':'Inactive'}</Status></td><td><button className="btn light small" onClick={()=>setSelected(item)}>Edit</button></td></tr>)}</tbody></table>{!items.length&&<Empty>No collections found.</Empty>}</div></section>{selected&&<Drawer title="Edit collection" close={()=>setSelected(null)}><div className="form-grid"><Field label="Name"><input value={selected.name||''} onChange={e=>setSelected({...selected,name:e.target.value})}/></Field><Field label="Type"><select value={selected.type||'curated'} onChange={e=>setSelected({...selected,type:e.target.value})}><option>curated</option><option>seasonal</option><option>featured</option><option>promotional</option></select></Field><Field full label="Description"><textarea value={selected.description||''} onChange={e=>setSelected({...selected,description:e.target.value})}/></Field><Field label="Image URL"><input value={selected.image||''} onChange={e=>setSelected({...selected,image:e.target.value})}/></Field><Field label="Banner URL"><input value={selected.banner||''} onChange={e=>setSelected({...selected,banner:e.target.value})}/></Field></div><div className="row-actions"><label className="tiny"><input type="checkbox" checked={!!selected.featured} onChange={e=>setSelected({...selected,featured:e.target.checked})}/> Featured</label><label className="tiny"><input type="checkbox" checked={selected.active!==false} onChange={e=>setSelected({...selected,active:e.target.checked})}/> Active</label></div><button className="btn primary" style={{marginTop:15}} onClick={save}>Save collection</button></Drawer>}</>}

    function Coupons({notify}){const [items,setItems]=useState([]);const [form,setForm]=useState(null);const load=()=>api('/api/admin/coupons').then(setItems).catch(e=>notify(e.message,'error'));useEffect(()=>{load();},[]);const save=()=>{const method=form._id?'PUT':'POST';const url=form._id?`/api/admin/coupons/${form._id}`:'/api/admin/coupons';api(url,{method,body:JSON.stringify(form)}).then(()=>{notify('Promotion saved.');setForm(null);load();}).catch(e=>notify(e.message,'error'));};return <><div className="page-head"><div><h2>Promotions & coupons</h2><p>Create discount codes customers can apply at checkout.</p></div><button className="btn primary" onClick={()=>setForm({code:'',description:'',discountType:'percent',discountValue:10,minOrderAmount:0,maxUses:100,active:true})}>Create coupon</button></div><section className="panel"><div className="table-wrap"><table className="table"><thead><tr><th>Code</th><th>Offer</th><th>Minimum</th><th>Uses</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody>{items.map(item=><tr key={item._id}><td><strong>{item.code}</strong><br/><span className="tiny muted">{item.description}</span></td><td>{item.discountType==='percent'?`${item.discountValue}%`:money(item.discountValue)}</td><td>{money(item.minOrderAmount||0)}</td><td>{item.usedCount||0}/{item.maxUses||'—'}</td><td>{date(item.validTo)}</td><td><Status>{item.active?'Active':'Inactive'}</Status></td><td><button className="btn light small" onClick={()=>setForm({...item,validFrom:item.validFrom?.slice?.(0,10)||'',validTo:item.validTo?.slice?.(0,10)||''})}>Edit</button></td></tr>)}</tbody></table>{!items.length&&<Empty>No coupons yet.</Empty>}</div></section>{form&&<Drawer title={form._id?'Edit coupon':'New coupon'} close={()=>setForm(null)}><div className="form-grid"><Field label="Code"><input value={form.code||''} onChange={e=>setForm({...form,code:e.target.value.toUpperCase()})}/></Field><Field label="Discount type"><select value={form.discountType||'percent'} onChange={e=>setForm({...form,discountType:e.target.value})}><option value="percent">Percent</option><option value="fixed">Fixed amount</option></select></Field><Field label="Discount value"><input type="number" value={form.discountValue??0} onChange={e=>setForm({...form,discountValue:e.target.value})}/></Field><Field label="Minimum order"><input type="number" value={form.minOrderAmount??0} onChange={e=>setForm({...form,minOrderAmount:e.target.value})}/></Field><Field label="Maximum uses"><input type="number" value={form.maxUses??100} onChange={e=>setForm({...form,maxUses:e.target.value})}/></Field><Field label="Maximum discount"><input type="number" value={form.maxDiscount??''} onChange={e=>setForm({...form,maxDiscount:e.target.value})}/></Field><Field label="Valid from"><input type="date" value={form.validFrom||''} onChange={e=>setForm({...form,validFrom:e.target.value})}/></Field><Field label="Valid to"><input type="date" value={form.validTo||''} onChange={e=>setForm({...form,validTo:e.target.value})}/></Field><Field full label="Description"><textarea value={form.description||''} onChange={e=>setForm({...form,description:e.target.value})}/></Field></div><label className="tiny"><input type="checkbox" checked={form.active!==false} onChange={e=>setForm({...form,active:e.target.checked})}/> Coupon is active</label><button className="btn primary" style={{marginTop:15}} onClick={save}>Save coupon</button></Drawer>}</>}

    function Payouts({notify}){const [items,setItems]=useState([]);const [stores,setStores]=useState([]);const [form,setForm]=useState({storeId:'',periodFrom:'',periodTo:''});const load=()=>{api('/api/admin/payouts').then(setItems).catch(e=>notify(e.message,'error'));api('/api/admin/stores?status=all').then(setStores).catch(()=>{});};useEffect(()=>{load();},[]);const calculate=()=>api('/api/admin/payouts/calculate',{method:'POST',body:JSON.stringify(form)}).then(()=>{notify('Payout calculated.');setForm({storeId:'',periodFrom:'',periodTo:''});load();}).catch(e=>notify(e.message,'error'));const update=(payout,status)=>{const reference=status==='paid'?window.prompt('Payout reference (optional):')||'':'';api(`/api/admin/payouts/${payout._id}`,{method:'PUT',body:JSON.stringify({status,reference})}).then(()=>{notify(`Payout marked ${status}.`);load();}).catch(e=>notify(e.message,'error'));};return <><div className="page-head"><div><h2>Payouts & finance</h2><p>Calculate seller earnings, approve payouts and reconcile payment status.</p></div></div><section className="grid"><div className="panel"><h3>Calculate seller payout</h3><p className="panel-sub">Gross sales less the store’s marketplace commission for the chosen period.</p><Field label="Store"><select value={form.storeId} onChange={e=>setForm({...form,storeId:e.target.value})}><option value="">Choose a store</option>{stores.filter(store=>store.approvalStatus==='approved').map(store=><option key={store.id} value={store.id}>{store.name}</option>)}</select></Field><div className="form-grid"><Field label="From"><input type="date" value={form.periodFrom} onChange={e=>setForm({...form,periodFrom:e.target.value})}/></Field><Field label="To"><input type="date" value={form.periodTo} onChange={e=>setForm({...form,periodTo:e.target.value})}/></Field></div><button className="btn primary" onClick={calculate}>Calculate payout</button></div><div className="panel"><h3>Finance status</h3><div className="data-line"><span>Pending payouts</span><strong>{items.filter(item=>item.status==='pending').length}</strong></div><div className="data-line"><span>Approved payouts</span><strong>{items.filter(item=>item.status==='approved').length}</strong></div><div className="data-line"><span>Paid payouts</span><strong>{items.filter(item=>item.status==='paid').length}</strong></div></div></section><section className="panel" style={{marginTop:15}}><h3>Payout history</h3><div className="table-wrap"><table className="table"><thead><tr><th>Store</th><th>Period</th><th>Gross sales</th><th>Commission</th><th>Seller payout</th><th>Status</th><th></th></tr></thead><tbody>{items.map(item=><tr key={item._id}><td><strong>{item.storeName}</strong></td><td>{date(item.periodFrom)} – {date(item.periodTo)}</td><td>{money(item.grossSales)}</td><td>{money(item.commissionAmount)} ({item.commissionRate}%)</td><td><strong>{money(item.payoutAmount)}</strong></td><td><Status>{item.status}</Status></td><td><div className="row-actions">{item.status==='pending'&&<button className="btn gold small" onClick={()=>update(item,'approved')}>Approve</button>}{item.status==='approved'&&<button className="btn primary small" onClick={()=>update(item,'paid')}>Mark paid</button>}</div></td></tr>)}</tbody></table>{!items.length&&<Empty>No payout calculations yet.</Empty>}</div></section></>}

    function Reviews({notify}){const [items,setItems]=useState([]);const [selected,setSelected]=useState(null);const [response,setResponse]=useState('');const load=()=>api('/api/admin/reviews').then(setItems).catch(e=>notify(e.message,'error'));useEffect(()=>{load();},[]);const save=()=>api(`/api/admin/reviews/${selected._id}`,{method:'PUT',body:JSON.stringify({approved:selected.approved,adminResponse:response})}).then(()=>{notify('Review moderation saved.');setSelected(null);setResponse('');load();}).catch(e=>notify(e.message,'error'));return <><div className="page-head"><div><h2>Reviews & ratings</h2><p>Moderate abusive content, resolve reports and review marketplace feedback.</p></div><button className="btn light" onClick={load}>Refresh</button></div><section className="panel"><div className="table-wrap"><table className="table"><thead><tr><th>Customer</th><th>Review</th><th>Rating</th><th>Store</th><th>Visibility</th><th></th></tr></thead><tbody>{items.map(item=><tr key={item._id}><td>{item.userId?.name||'Customer'}<br/><span className="tiny muted">{item.userId?.email}</span></td><td><strong>{item.title||'Review'}</strong><br/><span className="tiny muted">{item.comment?.slice(0,100)}</span></td><td>★ {item.rating}</td><td>{item.storeId||'—'}</td><td><Status>{item.approved?'Active':'Hidden'}</Status></td><td><button className="btn light small" onClick={()=>{setSelected(item);setResponse(item.adminResponse?.message||'')}}>Moderate</button></td></tr>)}</tbody></table>{!items.length&&<Empty>No reviews yet.</Empty>}</div></section>{selected&&<Drawer title="Moderate review" close={()=>setSelected(null)}><div className="notice info"><strong>{selected.userId?.name||'Customer'} · ★ {selected.rating}</strong><br/>{selected.title}<br/>{selected.comment}</div><label className="tiny"><input type="checkbox" checked={selected.approved!==false} onChange={e=>setSelected({...selected,approved:e.target.checked})}/> Keep this review visible</label><Field label="Admin response / resolution note"><textarea value={response} onChange={e=>setResponse(e.target.value)} placeholder="Optional response or report resolution note"/></Field><button className="btn primary" onClick={save}>Save moderation</button></Drawer>}</>}

    function Notifications({notify}){const [form,setForm]=useState({audience:'customers',title:'',message:'',storeId:''});const [stores,setStores]=useState([]);const [busy,setBusy]=useState(false);useEffect(()=>{api('/api/admin/stores?status=all').then(setStores).catch(()=>{});},[]);const send=()=>{setBusy(true);api('/api/admin/announcements',{method:'POST',body:JSON.stringify(form)}).then(result=>{notify(`Announcement sent to ${result.recipientCount} account(s).`);setForm({audience:'customers',title:'',message:'',storeId:''});}).catch(e=>notify(e.message,'error')).finally(()=>setBusy(false));};return <><div className="page-head"><div><h2>Notifications & announcements</h2><p>Send marketplace, customer or store-specific announcements.</p></div></div><section className="announcement-card"><div className="form-grid"><Field label="Audience"><select value={form.audience} onChange={e=>setForm({...form,audience:e.target.value,storeId:''})}><option value="customers">All customers</option><option value="stores">All store admins</option><option value="all">All active users</option><option value="specific_store">Specific store owner</option></select></Field>{form.audience==='specific_store'&&<Field label="Store"><select value={form.storeId} onChange={e=>setForm({...form,storeId:e.target.value})}><option value="">Choose store</option>{stores.map(store=><option key={store.id} value={store.id}>{store.name}</option>)}</select></Field>}<Field full label="Announcement title"><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></Field><Field full label="Message"><textarea value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="Write the announcement customers or stores should receive…"/></Field></div><button className="btn primary" disabled={busy} onClick={send}>{busy?'Sending…':'Send announcement'}</button></section></>}

        
    function Refunds({notify}){
      const [items,setItems]=useState([]);
      const [status,setStatus]=useState('all');
      const [selected,setSelected]=useState(null);
      const [form,setForm]=useState({status:'under_review',adminNotes:'',amountApproved:'',payfastRefundRef:''});
      const load=()=>api('/api/admin/refunds?status='+encodeURIComponent(status)).then(setItems).catch(e=>notify(e.message,'error'));
      useEffect(()=>{load();},[status]);
      const open=item=>{
        setSelected(item);
        setForm({
          status:item.status||'open',
          adminNotes:item.adminNotes||'',
          amountApproved:item.amountApproved??item.amountRequested??'',
          payfastRefundRef:item.payfastRefundRef||''
        });
      };
      const save=()=>api('/api/admin/refunds/'+selected._id,{method:'PUT',body:JSON.stringify(form)}).then(()=>{notify('Refund updated.');setSelected(null);load();}).catch(e=>notify(e.message,'error'));
      return <>
        <div className="page-head"><div><h2>Refunds & disputes</h2><p>Review customer refund requests, approve or reject, and record PayFast refund references.</p></div>
          <div className="top-actions">
            <select value={status} onChange={e=>setStatus(e.target.value)}>
              <option value="all">All statuses</option>
              <option value="open">Open</option>
              <option value="under_review">Under review</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="refunded">Refunded</option>
              <option value="closed">Closed</option>
            </select>
            <button className="btn light" onClick={load}>Refresh</button>
          </div>
        </div>
        <section className="panel">
          <div className="table-wrap"><table className="table">
            <thead><tr><th>Order</th><th>Customer</th><th>Reason</th><th>Amount</th><th>Status</th><th>Opened</th><th></th></tr></thead>
            <tbody>
              {items.map(item=>(
                <tr key={item._id}>
                  <td><strong>{item.orderNumber||item.orderId?.orderNumber||'—'}</strong></td>
                  <td>{item.userId?.name||'Customer'}<br/><span className="tiny muted">{item.userId?.email}</span></td>
                  <td><strong>{item.reason}</strong><br/><span className="tiny muted">{(item.details||'').slice(0,80)}</span></td>
                  <td>{item.amountRequested!=null?money(item.amountRequested):'—'}</td>
                  <td><Status>{item.status}</Status></td>
                  <td>{date(item.createdAt)}</td>
                  <td><button className="btn light small" onClick={()=>open(item)}>Manage</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          {!items.length&&<Empty>No refund requests in this filter.</Empty>}
          </div>
        </section>
        {selected&&<Drawer title={`Refund · ${selected.orderNumber||''}`} close={()=>setSelected(null)}>
          <div className="data-line"><span>Customer</span><strong>{selected.userId?.name} · {selected.userId?.email}</strong></div>
          <div className="data-line"><span>Reason</span><strong>{selected.reason}</strong></div>
          <p className="tiny" style={{lineHeight:1.6,marginTop:10}}>{selected.details||'No details provided.'}</p>
          <div className="form-grid" style={{marginTop:14}}>
            <Field label="Status"><select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
              <option value="open">Open</option>
              <option value="under_review">Under review</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="refunded">Refunded</option>
              <option value="closed">Closed</option>
            </select></Field>
            <Field label="Amount approved (R)"><input type="number" value={form.amountApproved} onChange={e=>setForm({...form,amountApproved:e.target.value})}/></Field>
            <Field full label="PayFast refund reference"><input value={form.payfastRefundRef} onChange={e=>setForm({...form,payfastRefundRef:e.target.value})} placeholder="Optional gateway reference"/></Field>
            <Field full label="Admin notes (sent to customer when resolved)"><textarea value={form.adminNotes} onChange={e=>setForm({...form,adminNotes:e.target.value})}/></Field>
          </div>
          <button className="btn primary" style={{marginTop:12}} onClick={save}>Save refund decision</button>
        </Drawer>}
      </>;
    }


    function Support({notify}){const [items,setItems]=useState([]);const [selected,setSelected]=useState(null);const [reply,setReply]=useState('');const load=()=>api('/api/admin/support').then(setItems).catch(e=>notify(e.message,'error'));useEffect(()=>{load();},[]);const save=()=>api(`/api/admin/support/${selected._id}`,{method:'PUT',body:JSON.stringify({status:selected.status,priority:selected.priority,message:reply})}).then(updated=>{setSelected(updated);setReply('');notify('Support ticket updated.');load();}).catch(e=>notify(e.message,'error'));return <><div className="page-head"><div><h2>Support inbox</h2><p>Respond to customer and store support conversations.</p></div><button className="btn light" onClick={load}>Refresh</button></div><section className="panel"><div className="table-wrap"><table className="table"><thead><tr><th>Customer</th><th>Subject</th><th>Created</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>{items.map(item=><tr key={item._id}><td>{item.userId?.name||'—'}<br/><span className="tiny muted">{item.userId?.email}</span></td><td><strong>{item.subject}</strong><br/><span className="tiny muted">{item.message?.slice(0,80)}</span></td><td>{date(item.createdAt)}</td><td><Status>{item.priority}</Status></td><td><Status>{item.status}</Status></td><td><button className="btn light small" onClick={()=>setSelected(item)}>Open</button></td></tr>)}</tbody></table>{!items.length&&<Empty>No support tickets.</Empty>}</div></section>{selected&&<Drawer title={selected.subject} close={()=>setSelected(null)}><div className="data-line"><span>Customer</span><strong>{selected.userId?.name} · {selected.userId?.email}</strong></div><div className="section-label">Customer message</div><p className="tiny" style={{lineHeight:1.6}}>{selected.message}</p>{selected.responses?.map((response,index)=><div key={index} className="panel" style={{padding:11,marginTop:8,background:response.sender==='admin'?'#1b3d27':'#1a2e20'}}><strong className="tiny">{response.sender}</strong><p className="tiny" style={{margin:'4px 0'}}>{response.message}</p></div>)}<div className="form-grid" style={{marginTop:15}}><Field label="Status"><select value={selected.status} onChange={e=>setSelected({...selected,status:e.target.value})}><option value="open">Open</option><option value="pending">Pending</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></Field><Field label="Priority"><select value={selected.priority} onChange={e=>setSelected({...selected,priority:e.target.value})}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></Field><Field full label="Reply"><textarea value={reply} onChange={e=>setReply(e.target.value)} placeholder="Write a helpful response…"/></Field></div><button className="btn primary" onClick={save}>Save / send reply</button></Drawer>}</>}

    function Settings({notify}){const [form,setForm]=useState(null);useEffect(()=>{api('/api/admin/settings').then(settings=>setForm({deliveryFee:settings.deliveryFee??85,freeDeliveryAbove:settings.freeDeliveryAbove??1000,commissionDefault:settings.commissionDefault??12,cutoffHour:settings.cutoffHour||'14:00',supportEmail:settings.supportEmail||''})).catch(e=>notify(e.message,'error'));},[]);if(!form)return <Empty>Loading platform settings…</Empty>;const save=()=>api('/api/admin/settings',{method:'PUT',body:JSON.stringify(form)}).then(()=>notify('Marketplace settings saved.')).catch(e=>notify(e.message,'error'));return <><div className="page-head"><div><h2>Marketplace settings</h2><p>Shared checkout and marketplace defaults.</p></div></div><section className="panel" style={{maxWidth:760}}><div className="form-grid"><Field label="Nationwide delivery fee (R)"><input type="number" value={form.deliveryFee} onChange={e=>setForm({...form,deliveryFee:e.target.value})}/></Field><Field label="Free delivery threshold (R)"><input type="number" value={form.freeDeliveryAbove} onChange={e=>setForm({...form,freeDeliveryAbove:e.target.value})}/></Field><Field label="Default commission (%)"><input type="number" value={form.commissionDefault} onChange={e=>setForm({...form,commissionDefault:e.target.value})}/></Field><Field label="Default order cutoff"><input value={form.cutoffHour} onChange={e=>setForm({...form,cutoffHour:e.target.value})}/></Field><Field full label="Support email"><input type="email" value={form.supportEmail} onChange={e=>setForm({...form,supportEmail:e.target.value})}/></Field></div><button className="btn primary" onClick={save}>Save platform settings</button></section></>}

    function Audit(){const [items,setItems]=useState([]);useEffect(()=>{api('/api/admin/audit').then(setItems).catch(()=>{});},[]);return <><div className="page-head"><div><h2>Admin audit log</h2><p>Recent marketplace management actions.</p></div></div><section className="panel"><div className="table-wrap"><table className="table"><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Entity</th><th>Summary</th></tr></thead><tbody>{items.map(item=><tr key={item._id}><td>{new Date(item.createdAt).toLocaleString('en-ZA')}</td><td>{item.adminId?.name||'System'}<br/><span className="tiny muted">{item.adminId?.username}</span></td><td><Status>{item.action}</Status></td><td>{item.entityType}<br/><span className="tiny muted">{item.entityId}</span></td><td>{item.summary}</td></tr>)}</tbody></table>{!items.length&&<Empty>No audit activity yet.</Empty>}</div></section></>}

    function Profile({user,setUser,notify}){const [profile,setProfile]=useState({name:user.name||'',username:user.username||'',avatar:user.avatar||''});const [password,setPassword]=useState({currentPassword:'',newPassword:''});const saveProfile=()=>api('/api/auth/profile',{method:'PUT',body:JSON.stringify(profile)}).then(updated=>{setUser(updated);notify('Admin profile saved.');}).catch(e=>notify(e.message,'error'));const changePassword=()=>api('/api/auth/password',{method:'PUT',body:JSON.stringify(password)}).then(()=>{setPassword({currentPassword:'',newPassword:''});notify('Admin password changed.');}).catch(e=>notify(e.message,'error'));return <><div className="page-head"><div><h2>My admin profile</h2><p>Change the initial test login after you confirm the dashboard works.</p></div></div><section className="grid"><div className="panel"><h3>Profile details</h3><p className="panel-sub">Your username is used only for Super Admin login.</p><div className="form-grid"><Field label="Display name"><input value={profile.name} onChange={e=>setProfile({...profile,name:e.target.value})}/></Field><Field label="Username"><input value={profile.username} onChange={e=>setProfile({...profile,username:e.target.value.toLowerCase()})}/></Field><Field full label="Avatar image URL (optional)"><input value={profile.avatar} onChange={e=>setProfile({...profile,avatar:e.target.value})}/></Field></div><button className="btn primary" onClick={saveProfile}>Save profile</button></div><div className="panel"><h3>Change password</h3><p className="panel-sub">Use a unique password with at least 8 characters.</p><Field label="Current password"><input type="password" value={password.currentPassword} onChange={e=>setPassword({...password,currentPassword:e.target.value})}/></Field><Field label="New password"><input type="password" value={password.newPassword} onChange={e=>setPassword({...password,newPassword:e.target.value})}/></Field><button className="btn primary" onClick={changePassword}>Update password</button></div></section></>}

    function Drawer({title,close,children}){return <><div className="drawer-backdrop" onClick={close}></div><aside className="drawer"><div className="drawer-head"><div><h2>{title}</h2><p className="panel-sub">BCM FoodHub Super Admin</p></div><button className="close" onClick={close}>×</button></div>{children}</aside></>}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
